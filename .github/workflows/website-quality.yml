name: Website quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 2nspira-website
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 2nspira-website/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: node --test scripts/release-freshness.test.mjs
      - run: npm run test:careers && npm run test:team-delivery && npm run test:creative-studio && npm run test:operations
      - run: npm run build:ci
      - run: npx tsc --noEmit
