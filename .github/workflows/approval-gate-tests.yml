name: Verify approval dry-run
on:
  pull_request:
    paths: ['tools/approval-gate/**', '.github/workflows/approval-gate-tests.yml']
  push:
    branches: [main]
    paths: ['tools/approval-gate/**', '.github/workflows/approval-gate-tests.yml']
permissions:
  contents: read
jobs:
  approval-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/approval-gate -v
